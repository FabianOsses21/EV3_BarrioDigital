name: barriodigital

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
  AUTH_MODE: entra
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-f402d005-2163-4d89-a6cd-e07c25b973b2}
  AZURE_API_CLIENT_ID: ${AZURE_API_CLIENT_ID:-54bc913a-2f45-4e55-9eae-b30616a9f8d5}
  AZURE_REQUIRED_SCOPE: ${AZURE_REQUIRED_SCOPE:-OT.Create}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
  RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
  RABBITMQ_USER: ${RABBITMQ_USER:-barriodigital}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Copia .env.example a .env}
  QUEUE_TTL_MS: ${QUEUE_TTL_MS:-30000}
  DLQ_TTL_MS: ${DLQ_TTL_MS:-604800000}
  TZ: America/Santiago

x-app: &app
  restart: unless-stopped
  networks: [barriodigital]
  mem_limit: 768m

services:
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    networks: [barriodigital]
    environment:
      ZOOKEEPER_SERVER_ID: "1"
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
      ZOOKEEPER_INIT_LIMIT: "10"
      ZOOKEEPER_SYNC_LIMIT: "5"
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
      KAFKA_HEAP_OPTS: -Xms96m -Xmx192m
    volumes: ["zk1_data:/var/lib/zookeeper/data", "zk1_log:/var/lib/zookeeper/log"]
  kafka-1:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    networks: [barriodigital]
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports: ["127.0.0.1:29092:29092"]
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka1_data:/var/lib/kafka/data"]
  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    networks: [barriodigital]
    environment:
      ZOOKEEPER_SERVER_ID: "2"
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
      ZOOKEEPER_INIT_LIMIT: "10"
      ZOOKEEPER_SYNC_LIMIT: "5"
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
      KAFKA_HEAP_OPTS: -Xms96m -Xmx192m
    volumes: ["zk2_data:/var/lib/zookeeper/data", "zk2_log:/var/lib/zookeeper/log"]
  kafka-2:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    networks: [barriodigital]
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports: ["127.0.0.1:39092:39092"]
    environment:
      KAFKA_BROKER_ID: "2"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,HOST://localhost:39092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka2_data:/var/lib/kafka/data"]
  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    networks: [barriodigital]
    environment:
      ZOOKEEPER_SERVER_ID: "3"
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
      ZOOKEEPER_INIT_LIMIT: "10"
      ZOOKEEPER_SYNC_LIMIT: "5"
      ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
      KAFKA_HEAP_OPTS: -Xms96m -Xmx192m
    volumes: ["zk3_data:/var/lib/zookeeper/data", "zk3_log:/var/lib/zookeeper/log"]
  kafka-3:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    networks: [barriodigital]
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports: ["127.0.0.1:49092:49092"]
    environment:
      KAFKA_BROKER_ID: "3"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:49092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,HOST://localhost:49092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka3_data:/var/lib/kafka/data"]
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    networks: [barriodigital]
    depends_on: [kafka-1, kafka-2, kafka-3]
    entrypoint: ["/bin/bash","/init.sh"]
    volumes: ["./infra/kafka/init.sh:/init.sh:ro"]
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    networks: [barriodigital]
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: BarrioDigital
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
  kafkaadmin:
    <<: *app
    build: {context: ./backend, target: kafkaadmin}
    environment: *app-env
  rabbitmq-1:
    image: rabbitmq:4.2.9-management
    hostname: rabbitmq-1
    restart: unless-stopped
    environment: &rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Copia .env.example a .env}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-barriodigital}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Copia .env.example a .env}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq-1/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [barriodigital]
    healthcheck: &rabbit-health
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s

  rabbitmq-2:
    image: rabbitmq:4.2.9-management
    hostname: rabbitmq-2
    restart: unless-stopped
    environment:
      <<: *rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
    depends_on:
      rabbitmq-1: {condition: service_started}
    ports: ["127.0.0.1:5673:5672", "127.0.0.1:15673:15672"]
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq-2/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [barriodigital]
    healthcheck: *rabbit-health

  cluster-check:
    image: rabbitmq:4.2.9-management
    hostname: cluster-check
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Copia .env.example a .env}
    entrypoint: ["/bin/sh", "/check-cluster.sh"]
    volumes: ["./infra/rabbitmq/check-cluster.sh:/check-cluster.sh:ro"]
    depends_on:
      rabbitmq-1: {condition: service_healthy}
      rabbitmq-2: {condition: service_healthy}
    networks: [barriodigital]
    restart: "no"

  catalog:
    <<: *app
    build: {context: ./backend, target: catalog}
    environment:
      <<: *app-env
      DB_URL: jdbc:h2:file:/app/data/catalog;DB_CLOSE_ON_EXIT=FALSE
    volumes: ["catalog_data:/app/data"]

  rabbitadmin:
    <<: *app
    build: {context: ./backend, target: rabbitadmin}
    environment:
      <<: *app-env
      RABBITMQ_MANAGEMENT_URLS: http://rabbitmq-1:15672,http://rabbitmq-2:15672
    depends_on:
      cluster-check: {condition: service_completed_successfully}

  requests:
    <<: *app
    build: {context: ./backend, target: requests}
    environment:
      <<: *app-env
      DB_URL: jdbc:h2:file:/app/data/requests;DB_CLOSE_ON_EXIT=FALSE
      CATALOG_URL: http://catalog:8082
    volumes: ["requests_data:/app/data"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      catalog: {condition: service_healthy}
      rabbitadmin: {condition: service_healthy}

  notify:
    <<: *app
    build: {context: ./backend, target: notify}
    environment:
      <<: *app-env
      DB_URL: jdbc:h2:file:/app/data/notify;DB_CLOSE_ON_EXIT=FALSE
      DEMO_FAILURE_ENABLED: ${DEMO_FAILURE_ENABLED:-true}
    volumes: ["notify_data:/app/data"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      rabbitadmin: {condition: service_healthy}

  bff:
    <<: *app
    build: {context: ./backend, target: bff}
    environment:
      <<: *app-env
      CATALOG_URL: http://catalog:8082
      REQUESTS_URL: http://requests:8083
      NOTIFY_URL: http://notify:8084
      RABBITADMIN_URL: http://rabbitadmin:8085
    depends_on:
      requests: {condition: service_healthy}
      notify: {condition: service_healthy}

  api-gateway:
    build: ./infra/gateway
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      bff: {condition: service_healthy}
    networks: [barriodigital]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      AUTH_MODE: entra
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-f402d005-2163-4d89-a6cd-e07c25b973b2}
      AZURE_SPA_CLIENT_ID: ${AZURE_SPA_CLIENT_ID:-d7f096c4-0ef5-4833-8def-e802ffd7314a}
      AZURE_BACKEND_SCOPE: ${AZURE_BACKEND_SCOPE:-api://54bc913a-2f45-4e55-9eae-b30616a9f8d5/OT.Create}
    ports: ["127.0.0.1:4200:80"]
    depends_on:
      api-gateway: {condition: service_healthy}
    networks: [barriodigital]

networks:
  barriodigital: {driver: bridge}
volumes:
  rabbitmq1_data:
  rabbitmq2_data:
  catalog_data:
  requests_data:
  notify_data:
  zk1_data:
  zk1_log:
  kafka1_data:
  zk2_data:
  zk2_log:
  kafka2_data:
  zk3_data:
  zk3_log:
  kafka3_data:
