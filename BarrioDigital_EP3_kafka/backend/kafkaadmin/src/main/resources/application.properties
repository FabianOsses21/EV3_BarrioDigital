spring.application.name=ms-barriodigital-kafkaadmin
server.port=8086
app.auth.mode=${AUTH_MODE:entra}
app.auth.issuer=https://login.microsoftonline.com/${AZURE_TENANT_ID:f402d005-2163-4d89-a6cd-e07c25b973b2}/v2.0
app.auth.jwks=https://login.microsoftonline.com/${AZURE_TENANT_ID:f402d005-2163-4d89-a6cd-e07c25b973b2}/discovery/v2.0/keys
app.auth.audience=${AZURE_API_CLIENT_ID:acc38f45-b5ba-4e55-9b14-fcaa00f9c661}
app.auth.scope=${AZURE_REQUIRED_SCOPE:OT.Create}
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,kafka
management.health.rabbit.enabled=false
server.error.include-message=never

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
